<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Rekod Murid Lewat (v2.1)</title>


  <!-- =====================================================
       QR SCANNER
       ===================================================== -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f5f9;

      color: #1e293b;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding: 20px;

    }


    .header {

      text-align: center;

      margin-bottom: 20px;

    }


    .header h1 {

      margin: 0;

      font-size: 25px;

    }


    .header p {

      margin-top: 8px;

      color: #64748b;

    }


    #reader {

      background: white;

      padding: 10px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

      overflow: hidden;

    }


    #result {

      margin-top: 20px;

    }


    .card {

      background: white;

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

    }


    .success {

      border-left:
        6px solid #16a34a;

    }


    .error {

      border-left:
        6px solid #dc2626;

    }


    .success-title {

      color: #15803d;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .error-title {

      color: #b91c1c;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .info {

      margin: 10px 0;

      line-height: 1.5;

    }


    .big-id {

      font-size: 32px;

      font-weight: bold;

      text-align: center;

      margin: 20px 0;

      color: #2563eb;

      letter-spacing: 2px;

    }


    .notice {

      background: #eff6ff;

      border-radius: 10px;

      padding: 12px;

      margin-top: 15px;

      line-height: 1.5;

      font-size: 14px;

    }


    button {

      width: 100%;

      margin-top: 18px;

      padding: 16px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }


    .secondary-button {

      background: #64748b;

    }


    .loading {

      text-align: center;

      padding: 20px;

    }

  </style>

</head>



<body>


<div class="container">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <div class="header">

    <h1>
      REKOD MURID LEWAT
    </h1>

    <p>
      Imbas QR murid yang tiba lewat
    </p>

  </div>


  <!-- =====================================================
       QR SCANNER
       ===================================================== -->

  <div id="reader"></div>


  <!-- =====================================================
       RESULT
       ===================================================== -->

  <div id="result"></div>


</div>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycby4Pm9xKbwLwVzxZTAWESBILTVSiyXF3i_o3Vn4we0jETXuxzA1AsNy-yATM7bkImnC/exec";


/* =====================================================
   VARIABLE
   ===================================================== */

let scanner = null;

let sedangScan = false;

let idMuridSemasa = "";



/* =====================================================
   QR BERJAYA DIBACA
   ===================================================== */

function qrBerjaya(
  decodedText,
  decodedResult
) {


  console.log(
    "QR DIBACA:",
    decodedText
  );


  /*
   * Elakkan scanner membaca
   * QR yang sama berkali-kali.
   */

  if (sedangScan) {

    return;

  }


  sedangScan = true;


  /*
   * Ambil ID daripada QR.
   */

  const idMurid =
    decodedText.trim();


  idMuridSemasa =
    idMurid;


  console.log(
    "ID MURID:",
    idMurid
  );


  /*
   * Hentikan kamera.
   */

  hentikanScanner();


  /*
   * Paparkan pengesahan.
   */

  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card success">


      <div class="success-title">

        ✓ QR BERJAYA DIBACA

      </div>


      <div class="big-id">

        ${escapeHTML(idMurid)}

      </div>


      <div class="info">

        QR murid telah berjaya
        dibaca.

      </div>


      <div class="notice">

        Tekan <strong>REKOD LEWAT</strong>
        untuk membuka sistem rekod.
        Rekod akan dimasukkan ke Google
        Sheet secara automatik.

      </div>


      <button
        onclick="bukaAppsScript()">

        REKOD LEWAT

      </button>


      <button
        class="secondary-button"
        onclick="mulaScanner()">

        BATAL / SCAN SEMULA

      </button>


    </div>

  `;

}



/* =====================================================
   BUKA APPS SCRIPT
   ===================================================== */

function bukaAppsScript() {


  /*
   * Pastikan ada ID.
   */

  if (!idMuridSemasa) {

    paparRalat(
      "ID murid tidak dijumpai."
    );

    return;

  }


  /*
   * Bina URL Apps Script.
   *
   * INI SAMA SEPERTI URL YANG
   * KITA SUDAH BUKTIKAN BERJAYA.
   */

  const url =

    API_URL +

    "?action=rekod" +

    "&id=" +
    encodeURIComponent(
      idMuridSemasa
    );


  console.log(
    "BUKA APPS SCRIPT:",
    url
  );


  /*
   * Buka dalam TAB BAHARU.
   *
   * GitHub kekal pada tab asal.
   */

  const tab =
    window.open(
      url,
      "_blank"
    );


  /*
   * Jika browser benarkan popup.
   */

  if (tab) {


    /*
     * Paparkan arahan kepada guru.
     */

    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card success">


        <div class="success-title">

          ✓ REKOD SEDANG DIPROSES

        </div>


        <div class="big-id">

          ${escapeHTML(
            idMuridSemasa
          )}

        </div>


        <div class="info">

          Google Apps Script telah
          dibuka dalam tab baharu.

        </div>


        <div class="notice">

          Sila tunggu sebentar sehingga
          rekod masuk ke Google Sheet.
          Kemudian kembali ke halaman
          scanner ini.

        </div>


        <button
          onclick="mulaScanner()">

          SCAN MURID SETERUSNYA

        </button>


      </div>

    `;


  } else {


    /*
     * Popup disekat browser.
     */

    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">


        <div class="error-title">

          POPUP DISEKAT

        </div>


        <div class="info">

          Browser menyekat pembukaan
          tab baharu.

        </div>


        <div class="notice">

          Tekan butang di bawah untuk
          membuka sistem rekod.

        </div>


        <button
          onclick="bukaAppsScriptManual()">

          BUKA SISTEM REKOD

        </button>


        <button
          class="secondary-button"
          onclick="mulaScanner()">

          BATAL / SCAN SEMULA

        </button>


      </div>

    `;

  }

}



/* =====================================================
   BUKA APPS SCRIPT SECARA MANUAL
   ===================================================== */

function bukaAppsScriptManual() {


  if (!idMuridSemasa) {

    return;

  }


  const url =

    API_URL +

    "?action=rekod" +

    "&id=" +
    encodeURIComponent(
      idMuridSemasa
    );


  /*
   * Oleh sebab fungsi ini dipanggil
   * terus daripada klik guru,
   * browser biasanya membenarkannya.
   */

  window.open(
    url,
    "_blank"
  );

}



/* =====================================================
   HENTIKAN SCANNER
   ===================================================== */

function hentikanScanner() {


  if (!scanner) {

    return;

  }


  scanner

    .clear()

    .then(function() {

      console.log(
        "Scanner dihentikan."
      );

    })

    .catch(function(error) {

      console.log(
        "Ralat hentikan scanner:",
        error
      );

    });

}



/* =====================================================
   MULAKAN SCANNER
   ===================================================== */

function mulaScanner() {


  console.log(
    "Memulakan scanner..."
  );


  /*
   * Kosongkan keputusan lama.
   */

  document.getElementById(
    "result"
  ).innerHTML = "";


  sedangScan = false;


  idMuridSemasa = "";


  /*
   * Bersihkan scanner lama
   * jika masih ada.
   */

  if (scanner) {

    scanner

      .clear()

      .catch(function(error) {

        console.log(
          "Scanner lama:",
          error
        );

      });

  }


  /*
   * Bina scanner.
   */

  scanner =
    new Html5Qrcode(
      "reader"
    );


  /*
   * Konfigurasi scanner.
   */

  const config = {

    fps: 15,

    qrbox: {

      width: 300,

      height: 300

    },

    aspectRatio: 1.0,

    formatsToSupport: [

      Html5QrcodeSupportedFormats
        .QR_CODE

    ]

  };


  /*
   * Hidupkan kamera.
   */

  scanner.start(

    {
      facingMode:
        "environment"
    },

    config,

    qrBerjaya,

    function(errorMessage) {

      /*
       * Abaikan mesej ketika
       * scanner sedang mencari QR.
       */

    }

  )

  .then(function() {

    console.log(
      "KAMERA BERJAYA DIMULAKAN."
    );

  })

  .catch(function(error) {


    console.error(
      "RALAT KAMERA:",
      error
    );


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">


        <div class="error-title">

          KAMERA TIDAK DAPAT DIBUKA

        </div>


        <div class="info">

          ${escapeHTML(
            error.message ||
            String(error)
          )}

        </div>


      </div>

    `;


    sedangScan = false;

  });

}



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(text) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}



/* =====================================================
   MULA SISTEM
   ===================================================== */

mulaScanner();


</script>


</body>

</html>
