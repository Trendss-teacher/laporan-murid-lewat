<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Rekod Murid Lewat</title>


  <!-- QR SCANNER -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f5f9;

      color: #1e293b;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding: 20px;

    }


    .header {

      text-align: center;

      margin-bottom: 20px;

    }


    .header h1 {

      margin: 0;

      font-size: 25px;

    }


    .header p {

      margin-top: 8px;

      color: #64748b;

    }


    #reader {

      background: white;

      padding: 10px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

      overflow: hidden;

    }


    #result {

      margin-top: 20px;

    }


    .card {

      background: white;

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

    }


    .success {

      border-left:
        6px solid #16a34a;

    }


    .error {

      border-left:
        6px solid #dc2626;

    }


    .success-title {

      color: #15803d;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .error-title {

      color: #b91c1c;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .info {

      margin: 9px 0;

      line-height: 1.5;

    }


    .loading {

      text-align: center;

      padding: 20px;

    }


    button {

      width: 100%;

      margin-top: 18px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }


    /*
     * Iframe untuk komunikasi
     * dengan Google Apps Script.
     */

    .hidden-frame {

      position: absolute;

      width: 1px;

      height: 1px;

      border: 0;

      opacity: 0;

      pointer-events: none;

    }

  </style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1>
      REKOD MURID LEWAT
    </h1>

    <p>
      Imbas QR murid yang tiba lewat
    </p>

  </div>


  <!-- QR SCANNER -->

  <div id="reader"></div>


  <!-- KEPUTUSAN -->

  <div id="result"></div>


</div>



<script>


/* =================================================
   GOOGLE APPS SCRIPT URL
   ================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwIFOIdPcUo1VzgE_mm_tEGNYJDYUtVVkXXOEnz9yK3lrr-F2sJJg3Qk1PgaQIdIvte/exec";


/* =================================================
   VARIABLE
   ================================================= */

let scanner = null;

let sedangScan = false;

let apiFrame = null;

let apiToken = null;

let apiTimeout = null;



/* =================================================
   QR BERJAYA DIBACA
   ================================================= */

function qrBerjaya(
  decodedText,
  decodedResult
) {


  console.log(
    "QR DIBACA:",
    decodedText
  );


  /*
   * Elakkan scan berganda
   */

  if (sedangScan) {

    return;

  }


  sedangScan = true;


  /*
   * Ambil ID
   */

  const idMurid =
    decodedText.trim();


  /*
   * Paparkan status
   */

  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card">


      <div class="success-title">

        QR BERJAYA DIBACA

      </div>


      <div class="info">

        <strong>Data QR:</strong><br>

        ${escapeHTML(idMurid)}

      </div>


      <div class="info">

        Sedang merekod murid...

      </div>


    </div>

  `;


  /*
   * Hentikan scanner
   */

  hentikanScanner();


  /*
   * Hantar ke Apps Script
   */

  panggilAPI(idMurid);

}



/* =================================================
   HENTIKAN SCANNER
   ================================================= */

function hentikanScanner() {


  if (!scanner) {

    return;

  }


  scanner
    .clear()

    .then(function() {

      console.log(
        "Scanner dihentikan."
      );

    })

    .catch(function(error) {

      console.log(
        "Scanner gagal dihentikan:",
        error
      );

    });

}



/* =================================================
   PANGGIL APPS SCRIPT
   MENGGUNAKAN HIDDEN IFRAME
   ================================================= */

function panggilAPI(idMurid) {


  /*
   * Buat token unik
   */

  apiToken =
    buatToken();


  /*
   * Buang iframe lama
   */

  if (apiFrame) {

    apiFrame.remove();

    apiFrame = null;

  }


  /*
   * Buat iframe baharu
   */

  apiFrame =
    document.createElement(
      "iframe"
    );


  apiFrame.className =
    "hidden-frame";


  apiFrame.name =
    "apiFrame_" +
    apiToken;


  /*
   * Token + ID
   */

  const url =

    API_URL +

    "?action=rekod" +

    "&id=" +
    encodeURIComponent(
      idMurid
    ) +

    "&mode=iframe" +

    "&token=" +
    encodeURIComponent(
      apiToken
    );


  console.log(
    "HANTAR KE APPS SCRIPT:",
    url
  );


  /*
   * Masukkan iframe
   */

  document.body.appendChild(
    apiFrame
  );


  /*
   * Set URL selepas iframe
   * dimasukkan ke halaman
   */

  apiFrame.src =
    url;


  /*
   * Timeout keselamatan
   */

  apiTimeout =
    setTimeout(
      function() {

        console.log(
          "Timeout API."
        );


        paparRalat(
          "Sistem mengambil masa terlalu lama untuk memberi respons."
        );

      },
      15000
    );

}



/* =================================================
   TERIMA POSTMESSAGE
   ================================================= */

window.addEventListener(
  "message",
  function(event) {


    console.log(
      "POSTMESSAGE DITERIMA:",
      event.data
    );


    /*
     * Pastikan mesej datang
     * daripada sistem kita.
     */

    if (
      !event.data ||
      event.data.source !==
        "sistem-murid-lewat"
    ) {

      return;

    }


    /*
     * Pastikan token sama
     */

    if (
      event.data.token !==
      apiToken
    ) {

      return;

    }


    /*
     * Pastikan iframe yang betul
     */

    if (
      apiFrame &&
      event.source !==
        apiFrame.contentWindow
    ) {

      return;

    }


    /*
     * Batalkan timeout
     */

    if (apiTimeout) {

      clearTimeout(
        apiTimeout
      );

      apiTimeout = null;

    }


    /*
     * Ambil data
     */

    const data =
      event.data.data;


    /*
     * Buang iframe
     */

    if (apiFrame) {

      apiFrame.remove();

      apiFrame = null;

    }


    /*
     * Paparkan keputusan
     */

    paparKeputusan(data);

  }
);



/* =================================================
   PAPAR KEPUTUSAN
   ================================================= */

function paparKeputusan(data) {


  /*
   * GAGAL
   */

  if (!data.berjaya) {


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">


        <div class="error-title">

          QR TIDAK DIKENALI

        </div>


        <div class="info">

          ${escapeHTML(
            data.mesej ||
            "Murid tidak dijumpai."
          )}

        </div>


      </div>


      <button
        onclick="mulaScanner()">

        SCAN SEMULA

      </button>

    `;


    sedangScan = false;


    return;

  }


  /*
   * BERJAYA
   */

  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card success">


      <div class="success-title">

        ✓ REKOD BERJAYA

      </div>


      <div class="info">

        <strong>Nama:</strong><br>

        ${escapeHTML(
          data.nama
        )}

      </div>


      <div class="info">

        <strong>Kelas:</strong><br>

        ${escapeHTML(
          data.kelas
        )}

      </div>


      <div class="info">

        <strong>Tarikh:</strong><br>

        ${escapeHTML(
          data.tarikh
        )}

      </div>


      <div class="info">

        <strong>Masa tiba:</strong><br>

        ${escapeHTML(
          data.masa
        )}

      </div>


    </div>


    <button
      onclick="mulaScanner()">

      SCAN MURID SETERUSNYA

    </button>

  `;


  sedangScan = false;

}



/* =================================================
   RALAT
   ================================================= */

function paparRalat(mesej) {


  if (apiTimeout) {

    clearTimeout(
      apiTimeout
    );

    apiTimeout = null;

  }


  if (apiFrame) {

    apiFrame.remove();

    apiFrame = null;

  }


  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card error">


      <div class="error-title">

        RALAT SISTEM

      </div>


      <div class="info">

        ${escapeHTML(
          mesej
        )}

      </div>


    </div>


    <button
      onclick="mulaScanner()">

      CUBA SEMULA

    </button>

  `;


  sedangScan = false;

}



/* =================================================
   MULAKAN SCANNER
   ================================================= */

function mulaScanner() {


  console.log(
    "Memulakan scanner..."
  );


  sedangScan = false;


  document.getElementById(
    "result"
  ).innerHTML = "";


  /*
   * Jika ada scanner lama,
   * cuba bersihkan.
   */

  if (scanner) {

    scanner
      .clear()

      .catch(
        function(error) {

          console.log(
            "Scanner lama:",
            error
          );

        }
      );

  }


  /*
   * Bina scanner
   */

  scanner =
    new Html5Qrcode(
      "reader"
    );


  /*
   * Tetapan scanner
   */

  const config = {

    fps: 15,

    qrbox: {

      width: 300,

      height: 300

    },

    aspectRatio: 1.0,

    formatsToSupport: [

      Html5QrcodeSupportedFormats
        .QR_CODE

    ]

  };


  /*
   * Mulakan kamera
   */

  scanner.start(

    {
      facingMode:
        "environment"
    },

    config,

    qrBerjaya,

    function(errorMessage) {

      /*
       * Abaikan mesej
       * ketika mencari QR.
       */

    }

  )

  .then(function() {

    console.log(
      "Kamera berjaya dimulakan."
    );

  })

  .catch(function(error) {


    console.error(
      "Ralat kamera:",
      error
    );


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">


        <div class="error-title">

          KAMERA TIDAK DAPAT DIBUKA

        </div>


        <div class="info">

          Browser tidak dapat
          mengakses kamera.

        </div>


        <div class="info">

          ${escapeHTML(
            error.message ||
            String(error)
          )}

        </div>


      </div>

    `;

  });

}



/* =================================================
   TOKEN UNIK
   ================================================= */

function buatToken() {


  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2)
  );

}



/* =================================================
   ESCAPE HTML
   ================================================= */

function escapeHTML(text) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}



/* =================================================
   START
   ================================================= */

mulaScanner();


</script>


</body>

</html>
