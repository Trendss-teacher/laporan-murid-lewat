<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Rekod Murid Lewat</title>


  <!-- =====================================================
       jsQR
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f5f9;

      color: #1e293b;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding: 20px;

    }


    .header {

      text-align: center;

      margin-bottom: 20px;

    }


    .header h1 {

      margin: 0;

      font-size: 25px;

    }


    .header p {

      margin-top: 8px;

      color: #64748b;

    }


    /*
     * CAMERA
     */

    .camera-box {

      position: relative;

      width: 100%;

      background: #000;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.15);

    }


    #video {

      display: block;

      width: 100%;

      height: auto;

      min-height: 300px;

      object-fit: cover;

      background: #000;

    }


    /*
     * QR GUIDE
     */

    .scan-guide {

      position: absolute;

      left: 10%;

      top: 15%;

      width: 80%;

      height: 70%;

      border: 3px solid rgba(255,255,255,0.8);

      border-radius: 12px;

      pointer-events: none;

    }


    .scan-guide::after {

      content: "";

      position: absolute;

      left: 0;

      right: 0;

      top: 50%;

      height: 2px;

      background: rgba(255,255,255,0.7);

    }


    /*
     * STATUS KAMERA
     */

    .camera-status {

      position: absolute;

      left: 10px;

      right: 10px;

      bottom: 10px;

      padding: 8px 12px;

      background:
        rgba(0,0,0,0.65);

      color: white;

      border-radius: 8px;

      text-align: center;

      font-size: 14px;

    }


    /*
     * RESULT
     */

    #result {

      margin-top: 20px;

    }


    .card {

      background: white;

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

    }


    .success {

      border-left:
        6px solid #16a34a;

    }


    .error {

      border-left:
        6px solid #dc2626;

    }


    .success-title {

      color: #15803d;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .error-title {

      color: #b91c1c;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .info {

      margin: 10px 0;

      line-height: 1.5;

    }


    .big-id {

      font-size: 32px;

      font-weight: bold;

      text-align: center;

      margin: 20px 0;

      color: #2563eb;

      letter-spacing: 2px;

    }


    .notice {

      background: #eff6ff;

      border-radius: 10px;

      padding: 12px;

      margin-top: 15px;

      line-height: 1.5;

      font-size: 14px;

    }


    button {

      width: 100%;

      margin-top: 18px;

      padding: 16px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }


    .secondary-button {

      background: #64748b;

    }


    .hidden-canvas {

      display: none;

    }

  </style>

</head>



<body>


<div class="container">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <div class="header">

    <h1>
      REKOD MURID LEWAT (Versi sakit hati)
    </h1>

    <p>
      Imbas QR murid yang tiba lewat
    </p>

  </div>


  <!-- =====================================================
       CAMERA
       ===================================================== -->

  <div class="camera-box">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>


    <div class="scan-guide"></div>


    <div
      id="cameraStatus"
      class="camera-status">

      Memulakan kamera...

    </div>

  </div>


  <!-- =====================================================
       CANVAS
       ===================================================== -->

  <canvas
    id="canvas"
    class="hidden-canvas">
  </canvas>


  <!-- =====================================================
       RESULT
       ===================================================== -->

  <div id="result"></div>


</div>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycby4Pm9xKbwLwVzxZTAWESBILTVSiyXF3i_o3Vn4we0jETXuxzA1AsNy-yATM7bkImnC/exec";


/* =====================================================
   ELEMENT
   ===================================================== */

const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const ctx =
  canvas.getContext("2d", {
    willReadFrequently: true
  });


const cameraStatus =
  document.getElementById(
    "cameraStatus"
  );


const result =
  document.getElementById(
    "result"
  );


/* =====================================================
   VARIABLE
   ===================================================== */

let stream = null;

let scanning = false;

let sedangScan = false;

let idMuridSemasa = "";


/*
 * Untuk mengelakkan QR sama
 * dibaca berkali-kali.
 */

let lastDetected = "";

let lastDetectedTime = 0;



/* =====================================================
   MULAKAN KAMERA
   ===================================================== */

async function mulaKamera() {


  try {


    cameraStatus.textContent =
      "Meminta akses kamera...";


    /*
     * Kamera belakang.
     *
     * Kita tidak menetapkan resolution
     * secara terlalu ketat kerana setiap
     * telefon berbeza.
     */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    /*
     * Sambungkan stream kepada video.
     */

    video.srcObject =
      stream;


    await video.play();


    /*
     * Pastikan saiz video sudah tersedia.
     */

    cameraStatus.textContent =
      "Kamera aktif — halakan QR ke kamera";


    scanning = true;


    /*
     * Mulakan loop scanner.
     */

    requestAnimationFrame(
      scanFrame
    );


  }

  catch (error) {


    console.error(
      "RALAT KAMERA:",
      error
    );


    cameraStatus.textContent =
      "Kamera tidak dapat dibuka.";


    result.innerHTML = `

      <div class="card error">


        <div class="error-title">

          KAMERA TIDAK DAPAT DIBUKA

        </div>


        <div class="info">

          ${escapeHTML(
            error.message ||
            String(error)
          )}

        </div>


      </div>

    `;

  }

}



/* =====================================================
   SCAN FRAME
   ===================================================== */

function scanFrame() {


  /*
   * Jika scanning dihentikan,
   * jangan teruskan loop.
   */

  if (!scanning) {

    return;

  }


  /*
   * Video belum mempunyai frame.
   */

  if (
    video.readyState !==
    video.HAVE_ENOUGH_DATA
  ) {

    requestAnimationFrame(
      scanFrame
    );

    return;

  }


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  if (
    width === 0 ||
    height === 0
  ) {

    requestAnimationFrame(
      scanFrame
    );

    return;

  }


  /*
   * Gunakan SELURUH frame kamera.
   *
   * Tidak ada qrbox.
   * Tidak perlu QR tepat di tengah.
   */

  canvas.width =
    width;


  canvas.height =
    height;


  ctx.drawImage(

    video,

    0,
    0,

    width,
    height

  );


  /*
   * Ambil pixel image.
   */

  const imageData =
    ctx.getImageData(

      0,
      0,

      width,
      height

    );


  /*
   * Cuba decode QR.
   *
   * inversionAttempts attemptBoth
   * membantu keadaan QR yang kontrasnya
   * pelik / terbalik.
   */

  const code =
    jsQR(

      imageData.data,

      imageData.width,

      imageData.height,

      {

        inversionAttempts:
          "attemptBoth"

      }

    );


  /*
   * QR dijumpai.
   */

  if (code) {


    console.log(
      "================================"
    );

    console.log(
      "QR DIKESAN!"
    );

    console.log(
      "DATA:",
      code.data
    );

    console.log(
      "================================"
    );


    prosesQR(
      code.data
    );


    return;

  }


  /*
   * Belum jumpa QR.
   */

  requestAnimationFrame(
    scanFrame
  );

}



/* =====================================================
   PROSES QR
   ===================================================== */

function prosesQR(
  decodedText
) {


  /*
   * Elakkan scan kedua.
   */

  if (sedangScan) {

    return;

  }


  const idMurid =
    String(
      decodedText || ""
    ).trim();


  if (!idMurid) {

    return;

  }


  /*
   * Elakkan QR yang sama
   * dibaca berulang kali.
   */

  const sekarang =
    Date.now();


  if (

    idMurid ===
      lastDetected &&

    sekarang -
      lastDetectedTime <
      3000

  ) {

    return;

  }


  lastDetected =
    idMurid;


  lastDetectedTime =
    sekarang;


  sedangScan = true;

  idMuridSemasa =
    idMurid;


  /*
   * Hentikan scanner.
   */

  scanning = false;


  hentikanKamera();


  /*
   * Paparkan QR yang dibaca.
   */

  result.innerHTML = `

    <div class="card success">


      <div class="success-title">

        ✓ QR BERJAYA DIBACA

      </div>


      <div class="big-id">

        ${escapeHTML(idMurid)}

      </div>


      <div class="info">

        Data QR telah berjaya
        dikenal pasti.

      </div>


      <div class="notice">

        Tekan <strong>REKOD LEWAT</strong>
        untuk merekod murid ini.

      </div>


      <button
        onclick="bukaAppsScript()">

        REKOD LEWAT

      </button>


      <button
        class="secondary-button"
        onclick="scanSemula()">

        SCAN SEMULA

      </button>


    </div>

  `;

}



/* =====================================================
   BUKA APPS SCRIPT
   ===================================================== */

function bukaAppsScript() {


  if (!idMuridSemasa) {

    paparRalat(
      "ID murid tidak dijumpai."
    );

    return;

  }


  /*
   * URL yang kita sudah buktikan
   * boleh merekod.
   */

  const url =

    API_URL +

    "?action=rekod" +

    "&id=" +

    encodeURIComponent(
      idMuridSemasa
    );


  console.log(
    "BUKA APPS SCRIPT:",
    url
  );


  /*
   * Buka tab baharu.
   *
   * Tab GitHub kekal.
   */

  const tab =
    window.open(
      url,
      "_blank"
    );


  /*
   * Popup berjaya.
   */

  if (tab) {


    result.innerHTML = `

      <div class="card success">


        <div class="success-title">

          ✓ REKOD DIHANTAR

        </div>


        <div class="big-id">

          ${escapeHTML(
            idMuridSemasa
          )}

        </div>


        <div class="info">

          Sistem rekod telah dibuka
          dalam tab baharu.

        </div>


        <div class="notice">

          Rekod murid sedang
          dimasukkan ke Google Sheet.

        </div>


        <button
          onclick="scanSemula()">

          SCAN MURID SETERUSNYA

        </button>


      </div>

    `;


  }

  else {


    /*
     * Popup disekat.
     */

    result.innerHTML = `

      <div class="card error">


        <div class="error-title">

          POPUP DISEKAT

        </div>


        <div class="info">

          Browser menyekat tab baharu.

        </div>


        <button
          onclick="bukaAppsScriptManual()">

          BUKA SISTEM REKOD

        </button>


        <button
          class="secondary-button"
          onclick="scanSemula()">

          SCAN SEMULA

        </button>


      </div>

    `;

  }

}



/* =====================================================
   BUKA APPS SCRIPT MANUAL
   ===================================================== */

function bukaAppsScriptManual() {


  if (!idMuridSemasa) {

    return;

  }


  const url =

    API_URL +

    "?action=rekod" +

    "&id=" +

    encodeURIComponent(
      idMuridSemasa
    );


  window.open(
    url,
    "_blank"
  );

}



/* =====================================================
   HENTIKAN KAMERA
   ===================================================== */

function hentikanKamera() {


  if (!stream) {

    return;

  }


  stream
    .getTracks()
    .forEach(function(track) {

      track.stop();

    });


  stream = null;


  video.srcObject = null;

}



/* =====================================================
   SCAN SEMULA
   ===================================================== */

function scanSemula() {


  /*
   * Reset.
   */

  sedangScan = false;

  idMuridSemasa = "";


  result.innerHTML = "";


  cameraStatus.textContent =
    "Memulakan kamera...";


  /*
   * Hidupkan semula.
   */

  mulaKamera();

}



/* =====================================================
   RALAT
   ===================================================== */

function paparRalat(
  mesej
) {


  result.innerHTML = `

    <div class="card error">


      <div class="error-title">

        RALAT SISTEM

      </div>


      <div class="info">

        ${escapeHTML(mesej)}

      </div>


    </div>


    <button
      onclick="scanSemula()">

      SCAN SEMULA

    </button>

  `;


  sedangScan = false;

}



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(
  text
) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}



/* =====================================================
   MULAKAN
   ===================================================== */

mulaKamera();


</script>


</body>

</html>
