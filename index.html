<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Rekod Murid Lewat</title>


  <!-- =================================================
       QR SCANNER
       ================================================= -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f5f9;

      color: #1e293b;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding: 20px;

    }


    .header {

      text-align: center;

      margin-bottom: 20px;

    }


    .header h1 {

      margin: 0;

      font-size: 25px;

    }


    .header p {

      margin-top: 8px;

      color: #64748b;

    }


    #reader {

      background: white;

      padding: 10px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

      overflow: hidden;

    }


    #result {

      margin-top: 20px;

    }


    .card {

      background: white;

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

    }


    .success {

      border-left:
        6px solid #16a34a;

    }


    .error {

      border-left:
        6px solid #dc2626;

    }


    .success-title {

      color: #15803d;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .error-title {

      color: #b91c1c;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .info {

      margin: 9px 0;

      line-height: 1.5;

    }


    button {

      width: 100%;

      margin-top: 18px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }


    .loading {

      text-align: center;

      padding: 20px;

    }

  </style>

</head>



<body>


<div class="container">


  <!-- =================================================
       HEADER
       ================================================= -->

  <div class="header">

    <h1>
      REKOD MURID LEWAT
    </h1>

    <p>
      Imbas QR murid yang tiba lewat
    </p>

  </div>


  <!-- =================================================
       CAMERA / QR SCANNER
       ================================================= -->

  <div id="reader"></div>


  <!-- =================================================
       RESULT
       ================================================= -->

  <div id="result"></div>


</div>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycby4Pm9xKbwLwVzxZTAWESBILTVSiyXF3i_o3Vn4we0jETXuxzA1AsNy-yATM7bkImnC/exec";


/* =====================================================
   VARIABLE
   ===================================================== */

let scanner = null;

let sedangScan = false;


/* =====================================================
   QR BERJAYA DIBACA
   ===================================================== */

function qrBerjaya(
  decodedText,
  decodedResult
) {


  console.log(
    "QR DIBACA:",
    decodedText
  );


  /*
   * Elakkan scan berganda
   */

  if (sedangScan) {

    return;

  }


  sedangScan = true;


  /*
   * ID daripada QR
   */

  const idMurid =
    decodedText.trim();


  /*
   * Paparkan status
   */

  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card">

      <div class="success-title">

        QR BERJAYA DIBACA

      </div>


      <div class="info">

        <strong>ID:</strong><br>

        ${escapeHTML(idMurid)}

      </div>


      <div class="loading">

        Sedang merekod murid...

      </div>

    </div>

  `;


  /*
   * Hentikan scanner
   */

  if (scanner) {

    scanner

      .clear()

      .catch(function(error) {

        console.log(
          "Scanner clear:",
          error
        );

      });

  }


  /*
   * Panggil Apps Script
   */

  panggilAppsScript(idMurid);

}



/* =====================================================
   PANGGIL APPS SCRIPT MENGGUNAKAN JSONP
   ===================================================== */

function panggilAppsScript(idMurid) {


  /*
   * Buang script request lama
   */

  const scriptLama =
    document.getElementById(
      "appsScriptRequest"
    );


  if (scriptLama) {

    scriptLama.remove();

  }


  /*
   * Bina URL
   */

  const url =

    API_URL +

    "?action=rekod" +

    "&id=" +
    encodeURIComponent(
      idMurid
    ) +

    "&callback=terimaRespons" +

    "&t=" +
    Date.now();


  console.log(
    "REQUEST APPS SCRIPT:",
    url
  );


  /*
   * Cipta script tag
   *
   * INILAH JSONP
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    "appsScriptRequest";


  script.src =
    url;


  /*
   * Kalau browser gagal
   * memuatkan request
   */

  script.onerror =
    function() {

      console.error(
        "Gagal memuatkan Apps Script."
      );


      script.remove();


      paparRalat(
        "Tidak dapat berhubung dengan Google Apps Script."
      );

    };


  /*
   * Masukkan ke halaman
   */

  document.body.appendChild(
    script
  );

}



/* =====================================================
   FUNGSI JSONP
   ===================================================== */

function terimaRespons(data) {


  console.log(
    "RESPONS APPS SCRIPT:",
    data
  );


  /*
   * Buang script JSONP
   */

  const script =
    document.getElementById(
      "appsScriptRequest"
    );


  if (script) {

    script.remove();

  }


  /*
   * Paparkan keputusan
   */

  paparKeputusan(data);

}



/* =====================================================
   PAPAR KEPUTUSAN
   ===================================================== */

function paparKeputusan(data) {


  /*
   * MURID TIDAK DIKENALI
   */

  if (!data.berjaya) {


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">

        <div class="error-title">

          QR TIDAK DIKENALI

        </div>


        <div class="info">

          ${escapeHTML(
            data.mesej ||
            "Murid tidak dijumpai."
          )}

        </div>

      </div>


      <button
        onclick="mulaScanner()">

        SCAN SEMULA

      </button>

    `;


    sedangScan = false;


    return;

  }


  /*
   * BERJAYA
   */

  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card success">


      <div class="success-title">

        ✓ REKOD BERJAYA

      </div>


      <div class="info">

        <strong>Nama:</strong><br>

        ${escapeHTML(
          data.nama
        )}

      </div>


      <div class="info">

        <strong>Kelas:</strong><br>

        ${escapeHTML(
          data.kelas
        )}

      </div>


      <div class="info">

        <strong>Tarikh:</strong><br>

        ${escapeHTML(
          data.tarikh
        )}

      </div>


      <div class="info">

        <strong>Masa tiba:</strong><br>

        ${escapeHTML(
          data.masa
        )}

      </div>


    </div>


    <button
      onclick="mulaScanner()">

      SCAN MURID SETERUSNYA

    </button>

  `;


  sedangScan = false;

}



/* =====================================================
   PAPAR RALAT
   ===================================================== */

function paparRalat(mesej) {


  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card error">


      <div class="error-title">

        RALAT SISTEM

      </div>


      <div class="info">

        ${escapeHTML(mesej)}

      </div>


    </div>


    <button
      onclick="mulaScanner()">

      CUBA SEMULA

    </button>

  `;


  sedangScan = false;

}



/* =====================================================
   MULAKAN SCANNER
   ===================================================== */

function mulaScanner() {


  document.getElementById(
    "result"
  ).innerHTML = "";


  sedangScan = false;


  /*
   * Bersihkan scanner lama
   */

  if (scanner) {

    scanner

      .clear()

      .catch(function(error) {

        console.log(
          "Scanner lama:",
          error
        );

      });

  }


  /*
   * Scanner baharu
   */

  scanner =
    new Html5Qrcode(
      "reader"
    );


  /*
   * Konfigurasi
   */

  const config = {

    fps: 15,

    qrbox: {

      width: 300,

      height: 300

    },

    aspectRatio: 1.0,

    formatsToSupport: [

      Html5QrcodeSupportedFormats
        .QR_CODE

    ]

  };


  /*
   * Hidupkan kamera
   */

  scanner.start(

    {
      facingMode:
        "environment"
    },

    config,

    qrBerjaya,

    function(errorMessage) {

      /*
       * Abaikan ketika sedang
       * mencari QR.
       */

    }

  )

  .then(function() {

    console.log(
      "KAMERA BERJAYA DIMULAKAN."
    );

  })

  .catch(function(error) {


    console.error(
      "RALAT KAMERA:",
      error
    );


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">

        <div class="error-title">

          KAMERA TIDAK DAPAT DIBUKA

        </div>


        <div class="info">

          ${escapeHTML(
            error.message ||
            String(error)
          )}

        </div>

      </div>

    `;

  });

}



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(text) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}



/* =====================================================
   MULA SISTEM
   ===================================================== */

mulaScanner();


</script>


</body>

</html>
