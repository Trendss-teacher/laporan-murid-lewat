<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Rekod Murid Lewat</title>


  <!-- jsQR -->

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f5f9;

      color: #1e293b;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding: 20px;

    }


    .header {

      text-align: center;

      margin-bottom: 20px;

    }


    .header h1 {

      margin: 0;

      font-size: 25px;

    }


    .header p {

      margin-top: 8px;

      color: #64748b;

    }


    /* CAMERA */

    .camera-box {

      position: relative;

      width: 100%;

      background: #000;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.15);

    }


    #video {

      display: block;

      width: 100%;

      height: auto;

      min-height: 300px;

      object-fit: cover;

      background: #000;

    }


    /* GUIDE */

    .scan-guide {

      position: absolute;

      left: 10%;

      top: 15%;

      width: 80%;

      height: 70%;

      border:
        3px solid
        rgba(255,255,255,0.8);

      border-radius: 12px;

      pointer-events: none;

    }


    .scan-guide::after {

      content: "";

      position: absolute;

      left: 0;

      right: 0;

      top: 50%;

      height: 2px;

      background:
        rgba(255,255,255,0.7);

    }


    /* CAMERA STATUS */

    .camera-status {

      position: absolute;

      left: 10px;

      right: 10px;

      bottom: 10px;

      padding: 8px 12px;

      background:
        rgba(0,0,0,0.65);

      color: white;

      border-radius: 8px;

      text-align: center;

      font-size: 14px;

    }


    /* RESULT */

    #result {

      margin-top: 20px;

    }


    .card {

      background: white;

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

    }


    .success {

      border-left:
        6px solid #16a34a;

    }


    .error {

      border-left:
        6px solid #dc2626;

    }


    .success-title {

      color: #15803d;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .error-title {

      color: #b91c1c;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .student-name {

      font-size: 25px;

      font-weight: bold;

      text-align: center;

      margin: 18px 0 8px;

      line-height: 1.25;

    }


    .student-class {

      font-size: 19px;

      text-align: center;

      font-weight: bold;

      color: #2563eb;

    }


    .student-id {

      text-align: center;

      color: #64748b;

      margin-top: 8px;

    }


    .notice {

      background: #eff6ff;

      border-radius: 10px;

      padding: 12px;

      margin-top: 15px;

      line-height: 1.5;

      font-size: 14px;

    }


    button {

      width: 100%;

      margin-top: 18px;

      padding: 16px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }


    .secondary-button {

      background: #64748b;

    }


    .loading-text {

      text-align: center;

      font-weight: bold;

      color: #2563eb;

    }

  </style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1>
      REKOD MURID LEWAT
    </h1>

    <p>
      Imbas QR murid yang tiba lewat
    </p>

  </div>


  <!-- CAMERA -->

  <div class="camera-box">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div class="scan-guide"></div>

    <div
      id="cameraStatus"
      class="camera-status">

      Memulakan kamera...

    </div>

  </div>


  <canvas
    id="canvas"
    style="display:none;">
  </canvas>


  <div id="result"></div>


</div>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycby4Pm9xKbwLwVzxZTAWESBILTVSiyXF3i_o3Vn4we0jETXuxzA1AsNy-yATM7bkImnC/exec";


/* =====================================================
   VARIABLE
   ===================================================== */

let studentDatabase = [];

let stream = null;

let scanning = false;

let sedangScan = false;

let idMuridSemasa = "";

let lastDetected = "";

let lastDetectedTime = 0;


/* =====================================================
   LOAD DATABASE MURID
   ===================================================== */

async function loadStudentDatabase() {

  try {

    const response =
      await fetch("murid.json", {
        cache: "no-store"
      });


    if (!response.ok) {

      throw new Error(
        "Fail murid.json tidak dapat dibaca."
      );

    }


    studentDatabase =
      await response.json();


    console.log(
      "Database murid dimuatkan:",
      studentDatabase.length
    );


  } catch (error) {

    console.error(
      "Gagal load murid.json:",
      error
    );


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">

        <div class="error-title">

          DATABASE MURID TIDAK DAPAT DIMUATKAN

        </div>

        <div>

          ${escapeHTML(error.message)}

        </div>

      </div>

    `;

  }

}


/* =====================================================
   CARI MURID
   ===================================================== */

function cariMuridLokal(idMurid) {

  return studentDatabase.find(
    function(murid) {

      return String(murid.id)
        .trim()
        .toUpperCase()
        ===
        String(idMurid)
          .trim()
          .toUpperCase();

    }
  );

}


/* =====================================================
   BEEP
   ===================================================== */

function mainkanBunyiBeep() {

  try {

    const audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscillator =
      audioCtx.createOscillator();


    const gainNode =
      audioCtx.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.setValueAtTime(
      800,
      audioCtx.currentTime
    );


    gainNode.gain.setValueAtTime(
      0.5,
      audioCtx.currentTime
    );


    gainNode.gain.exponentialRampToValueAtTime(
      0.01,
      audioCtx.currentTime + 0.2
    );


    oscillator.connect(
      gainNode
    );


    gainNode.connect(
      audioCtx.destination
    );


    oscillator.start();


    oscillator.stop(
      audioCtx.currentTime + 0.2
    );


  } catch (e) {

    console.log(
      "Audio tidak disokong."
    );

  }

}


/* =====================================================
   MULAKAN KAMERA
   ===================================================== */

async function mulaKamera() {

  try {

    const cameraStatus =
      document.getElementById(
        "cameraStatus"
      );


    cameraStatus.textContent =
      "Meminta akses kamera...";


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          },

          advanced: [

            {
              focusMode:
                "continuous"
            }

          ]

        },

        audio: false

      });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      stream;


    await video.play();


    cameraStatus.textContent =
      "Kamera aktif — halakan QR ke kamera";


    scanning = true;


    requestAnimationFrame(
      scanFrame
    );


  } catch (error) {


    console.error(
      "RALAT KAMERA:",
      error
    );


    document.getElementById(
      "cameraStatus"
    ).textContent =
      "Kamera tidak dapat dibuka.";


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">

        <div class="error-title">

          KAMERA TIDAK DAPAT DIBUKA

        </div>

        <div>

          ${escapeHTML(
            error.message ||
            String(error)
          )}

        </div>

      </div>

    `;

  }

}


/* =====================================================
   SCAN FRAME
   ===================================================== */

function scanFrame() {

  if (!scanning) {

    return;

  }


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  if (
    video.readyState !==
    video.HAVE_ENOUGH_DATA
  ) {

    requestAnimationFrame(
      scanFrame
    );

    return;

  }


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  if (
    width === 0 ||
    height === 0
  ) {

    requestAnimationFrame(
      scanFrame
    );

    return;

  }


  canvas.width =
    width;


  canvas.height =
    height;


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  const imageData =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const code =
    jsQR(

      imageData.data,

      imageData.width,

      imageData.height,

      {
        inversionAttempts:
          "attemptBoth"
      }

    );


  if (code) {

    prosesQR(
      code.data
    );

    return;

  }


  requestAnimationFrame(
    scanFrame
  );

}


/* =====================================================
   PROSES QR
   ===================================================== */

function prosesQR(
  decodedText
) {

  if (sedangScan) {

    return;

  }


  const idMurid =
    String(
      decodedText || ""
    ).trim();


  if (!idMurid) {

    return;

  }


  const sekarang =
    Date.now();


  if (

    idMurid ===
      lastDetected &&

    sekarang -
      lastDetectedTime <
      3000

  ) {

    return;

  }


  lastDetected =
    idMurid;


  lastDetectedTime =
    sekarang;


  sedangScan = true;

  idMuridSemasa =
    idMurid;


  scanning = false;


  hentikanKamera();


  mainkanBunyiBeep();


  /*
   * CARI MURID SECARA TEMPATAN
   */

  const murid =
    cariMuridLokal(
      idMurid
    );


  /*
   * JIKA ID TIDAK WUJUD
   */

  if (!murid) {

    result.innerHTML = `

      <div class="card error">

        <div class="error-title">

          QR TIDAK DIKENALI

        </div>

        <div>

          ID murid:

          <strong>
            ${escapeHTML(idMurid)}
          </strong>

        </div>

        <div class="notice">

          ID ini tidak terdapat dalam
          database murid pada sistem.

        </div>

        <button
          onclick="scanSemula()">

          SCAN SEMULA

        </button>

      </div>

    `;

    return;

  }


  /*
   * PAPARKAN NAMA + KELAS
   */

  result.innerHTML = `

    <div class="card success">


      <div class="success-title">

        ✓ MURID DIKESAN

      </div>


      <div class="student-name">

        ${escapeHTML(
          murid.nama
        )}

      </div>


      <div class="student-class">

        Kelas: ${escapeHTML(
          murid.kelas
        )}

      </div>


      <div class="student-id">

        ID: ${escapeHTML(
          murid.id
        )}

      </div>


      <div class="notice">

        Sila semak nama dan kelas
        sebelum menekan
        <strong>REKOD LEWAT</strong>.

      </div>


      <button
        onclick="bukaAppsScript()">

        REKOD LEWAT

      </button>


      <button
        class="secondary-button"
        onclick="scanSemula()">

        SCAN SEMULA

      </button>


    </div>

  `;

}


/* =====================================================
   HANTAR KE APPS SCRIPT
   ===================================================== */

async function bukaAppsScript() {


  if (!idMuridSemasa) {

    paparRalat(
      "ID murid tidak dijumpai."
    );

    return;

  }


  const url =
    API_URL +
    "?action=rekod&id=" +
    encodeURIComponent(
      idMuridSemasa
    );


  /*
   * Paparan loading
   */

  result.innerHTML = `

    <div class="card">

      <div class="loading-text">

        ⏳ Sedang menghantar
        rekod ke pangkalan data...

      </div>

    </div>

  `;


  try {


    /*
     * KOD STABIL KITA.
     *
     * JANGAN UBAH:
     * mode: 'no-cors'
     */

    await fetch(

      url,

      {

        method: "GET",

        mode: "no-cors"

      }

    );


    /*
     * Browser tidak boleh membaca
     * response kerana no-cors.
     *
     * Tetapi request telah dihantar.
     */

    result.innerHTML = `

      <div class="card success">


        <div class="success-title">

          ✓ REKOD DIHANTAR

        </div>


        <div class="student-name">

          ${escapeHTML(
            cariMuridLokal(
              idMuridSemasa
            ).nama
          )}

        </div>


        <div class="student-class">

          ${escapeHTML(
            cariMuridLokal(
              idMuridSemasa
            ).kelas
          )}

        </div>


        <div class="notice">

          Rekod murid telah dihantar
          ke sistem.

        </div>


        <button
          onclick="scanSemula()">

          SCAN MURID SETERUSNYA

        </button>


      </div>

    `;


  } catch (error) {


    result.innerHTML = `

      <div class="card error">


        <div class="error-title">

          GAGAL MENGHANTAR DATA

        </div>


        <div>

          Sila semak sambungan internet
          dan cuba sekali lagi.

        </div>


        <button
          onclick="bukaAppsScript()">

          CUBA LAGI

        </button>


        <button
          class="secondary-button"
          onclick="scanSemula()">

          SCAN SEMULA

        </button>


      </div>

    `;

  }

}


/* =====================================================
   HENTIKAN KAMERA
   ===================================================== */

function hentikanKamera() {

  if (!stream) {

    return;

  }


  stream
    .getTracks()
    .forEach(
      function(track) {

        track.stop();

      }
    );


  stream = null;


  document.getElementById(
    "video"
  ).srcObject = null;

}


/* =====================================================
   SCAN SEMULA
   ===================================================== */

function scanSemula() {

  sedangScan = false;

  idMuridSemasa = "";


  result.innerHTML = "";


  document.getElementById(
    "cameraStatus"
  ).textContent =
    "Memulakan kamera...";


  mulaKamera();

}


/* =====================================================
   RALAT
   ===================================================== */

function paparRalat(
  mesej
) {

  result.innerHTML = `

    <div class="card error">

      <div class="error-title">

        RALAT SISTEM

      </div>

      <div>

        ${escapeHTML(
          mesej
        )}

      </div>

    </div>


    <button
      onclick="scanSemula()">

      SCAN SEMULA

    </button>

  `;


  sedangScan = false;

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}


/* =====================================================
   MULA SISTEM
   ===================================================== */

async function mulaSistem() {

  await loadStudentDatabase();

  await mulaKamera();

}


mulaSistem();


</script>


</body>

</html>
