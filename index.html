<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Rekod Murid Lewat</title>


  <!-- =============================================
       QR SCANNER
       ============================================= -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f5f9;

      color: #1e293b;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding: 20px;

    }


    .header {

      text-align: center;

      margin-bottom: 20px;

    }


    .header h1 {

      margin: 0;

      font-size: 25px;

    }


    .header p {

      margin-top: 8px;

      color: #64748b;

    }


    #reader {

      background: white;

      padding: 10px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

      overflow: hidden;

    }


    #result {

      margin-top: 20px;

    }


    .card {

      background: white;

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

    }


    .success {

      border-left:
        6px solid #16a34a;

    }


    .error {

      border-left:
        6px solid #dc2626;

    }


    .success-title {

      color: #15803d;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .error-title {

      color: #b91c1c;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .info {

      margin: 9px 0;

      line-height: 1.5;

    }


    .loading {

      text-align: center;

      padding: 20px;

    }


    button {

      width: 100%;

      margin-top: 18px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =============================================
       TAJUK
       ============================================= -->

  <div class="header">

    <h1>
      REKOD MURID LEWAT
    </h1>

    <p>
      Imbas QR murid yang tiba lewat
    </p>

  </div>


  <!-- =============================================
       SCANNER
       ============================================= -->

  <div id="reader"></div>


  <!-- =============================================
       KEPUTUSAN
       ============================================= -->

  <div id="result"></div>


</div>



<script>


/* ==================================================
   URL GOOGLE APPS SCRIPT
   ================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycby4Pm9xKbwLwVzxZTAWESBILTVSiyXF3i_o3Vn4we0jETXuxzA1AsNy-yATM7bkImnC/exec";


/* ==================================================
   VARIABLE
   ================================================== */

let scanner = null;

let sedangScan = false;



/* ==================================================
   QR BERJAYA
   ================================================== */
function qrBerjaya(decodedText, decodedResult) {

  console.log("QR DIBACA:", decodedText);

  if (sedangScan) {
    return;
  }

  sedangScan = true;

  const idMurid = decodedText.trim();

  /*
   * Paparkan maklumat yang telah dibaca
   */

  document.getElementById("result").innerHTML = `

    <div class="card">

      <div class="success-title">
        QR BERJAYA DIBACA
      </div>

      <div class="info">
        <strong>ID:</strong><br>
        ${escapeHTML(idMurid)}
      </div>

      <div class="loading">
        Membuka sistem rekod...
      </div>

    </div>

  `;


  /*
   * Bina URL Apps Script
   */

  const url =
    API_URL +
    "?action=rekod" +
    "&id=" +
    encodeURIComponent(idMurid);


  console.log("BUKA URL:", url);


  /*
   * INI YANG PALING PENTING
   *
   * Browser akan pergi ke URL
   * tersebut seperti kita taip
   * URL dan tekan ENTER.
   */

  setTimeout(function() {

    window.location.href = url;

  }, 500);

}



/* ==================================================
   HENTIKAN SCANNER
   ================================================== */

function hentikanScanner() {


  if (!scanner) {

    return Promise.resolve();

  }


  return scanner
    .clear()

    .catch(function(error) {

      console.log(
        "Ralat clear scanner:",
        error
      );

    });

}



/* ==================================================
   HANTAR KE APPS SCRIPT
   MENGGUNAKAN SEND BEACON
   ================================================== */

function hantarKeAppsScript(
  idMurid
) {


  /*
   * Data yang dihantar.
   *
   * Hanya ID.
   * Nama / IC / kelas tidak dihantar
   * dari browser.
   */

  const data = {

    id:
      idMurid

  };


  const blob =
    new Blob(

      [
        JSON.stringify(data)
      ],

      {
        type:
          "text/plain"
      }

    );


  /*
   * sendBeacon akan menghantar
   * POST ke Apps Script.
   */

  let berjaya =
    false;


  try {

    berjaya =
      navigator.sendBeacon(
        API_URL,
        blob
      );

  } catch (error) {

    console.error(
      "sendBeacon error:",
      error
    );

  }


  console.log(
    "sendBeacon:",
    berjaya
  );


  /*
   * Jika browser menerima
   * request untuk dihantar.
   */

  if (berjaya) {


    paparMenunggu(
      idMurid
    );


    /*
     * Bagi sedikit masa kepada
     * server menerima request.
     */

    setTimeout(
      function() {

        paparBerjaya(
          idMurid
        );

      },
      1200
    );


  } else {


    paparRalat(
      "Browser tidak berjaya menghantar data kepada sistem."
    );

  }

}



/* ==================================================
   PAPAR MENUNGGU
   ================================================== */

function paparMenunggu(
  idMurid
) {


  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card">


      <div class="success-title">

        QR BERJAYA DIBACA

      </div>


      <div class="info">

        <strong>ID:</strong><br>

        ${escapeHTML(idMurid)}

      </div>


      <div class="loading">

        Menghantar rekod...

      </div>


    </div>

  `;

}



/* ==================================================
   PAPAR BERJAYA
   ================================================== */

function paparBerjaya(
  idMurid
) {


  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card success">


      <div class="success-title">

        ✓ REKOD BERJAYA DIHANTAR

      </div>


      <div class="info">

        <strong>ID Murid:</strong><br>

        ${escapeHTML(idMurid)}

      </div>


      <div class="info">

        Rekod telah dihantar
        ke sistem.

      </div>


    </div>


    <button
      onclick="mulaScanner()">

      SCAN MURID SETERUSNYA

    </button>

  `;


  sedangScan = false;

}



/* ==================================================
   RALAT
   ================================================== */

function paparRalat(
  mesej
) {


  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card error">


      <div class="error-title">

        RALAT SISTEM

      </div>


      <div class="info">

        ${escapeHTML(mesej)}

      </div>


    </div>


    <button
      onclick="mulaScanner()">

      CUBA SEMULA

    </button>

  `;


  sedangScan = false;

}



/* ==================================================
   MULAKAN SCANNER
   ================================================== */

function mulaScanner() {


  document.getElementById(
    "result"
  ).innerHTML = "";


  sedangScan = false;


  /*
   * Bersihkan scanner lama
   */

  if (scanner) {

    scanner
      .clear()

      .catch(function(error) {

        console.log(
          "Scanner lama:",
          error
        );

      });

  }


  /*
   * Scanner baharu
   */

  scanner =
    new Html5Qrcode(
      "reader"
    );


  /*
   * Konfigurasi
   */

  const config = {

    fps: 15,

    qrbox: {

      width: 300,

      height: 300

    },

    aspectRatio: 1.0,

    formatsToSupport: [

      Html5QrcodeSupportedFormats
        .QR_CODE

    ]

  };


  /*
   * Buka kamera
   */

  scanner.start(

    {
      facingMode:
        "environment"
    },

    config,

    qrBerjaya,

    function(errorMessage) {

      /*
       * Abaikan mesej
       * ketika mencari QR.
       */

    }

  )

  .then(function() {

    console.log(
      "Kamera berjaya dimulakan."
    );

  })

  .catch(function(error) {


    console.error(
      "Ralat kamera:",
      error
    );


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">


        <div class="error-title">

          KAMERA TIDAK DAPAT DIBUKA

        </div>


        <div class="info">

          ${escapeHTML(
            error.message ||
            String(error)
          )}

        </div>


      </div>

    `;

  });

}



/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHTML(
  text
) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}



/* ==================================================
   MULA
   ================================================== */

mulaScanner();


</script>


</body>

</html>
