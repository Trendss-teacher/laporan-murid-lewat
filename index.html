<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Rekod Murid Lewat</title>


  <!-- =====================================================
       QR SCANNER
       ===================================================== -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f5f9;

      color: #1e293b;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding: 20px;

    }


    .header {

      text-align: center;

      margin-bottom: 20px;

    }


    .header h1 {

      margin: 0;

      font-size: 25px;

    }


    .header p {

      margin-top: 8px;

      color: #64748b;

    }


    #reader {

      background: white;

      padding: 10px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

      overflow: hidden;

    }


    /*
     * Pastikan video kamera tidak
     * dipaksa menjadi bentuk pelik.
     */

    #reader video {

      width: 100% !important;

      height: auto !important;

      object-fit: cover;

      border-radius: 10px;

    }


    #result {

      margin-top: 20px;

    }


    .card {

      background: white;

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

    }


    .success {

      border-left:
        6px solid #16a34a;

    }


    .error {

      border-left:
        6px solid #dc2626;

    }


    .success-title {

      color: #15803d;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .error-title {

      color: #b91c1c;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .info {

      margin: 10px 0;

      line-height: 1.5;

    }


    .big-id {

      font-size: 32px;

      font-weight: bold;

      text-align: center;

      margin: 20px 0;

      color: #2563eb;

      letter-spacing: 2px;

    }


    .notice {

      background: #eff6ff;

      border-radius: 10px;

      padding: 12px;

      margin-top: 15px;

      line-height: 1.5;

      font-size: 14px;

    }


    button {

      width: 100%;

      margin-top: 18px;

      padding: 16px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }


    .secondary-button {

      background: #64748b;

    }


    .loading {

      text-align: center;

      padding: 20px;

    }

  </style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1>
      REKOD MURID LEWAT (v2.3)
    </h1>

    <p>
      Imbas QR murid yang tiba lewat
    </p>

  </div>


  <!-- =====================================================
       CAMERA
       ===================================================== -->

  <div id="reader"></div>


  <!-- =====================================================
       RESULT
       ===================================================== -->

  <div id="result"></div>


</div>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycby4Pm9xKbwLwVzxZTAWESBILTVSiyXF3i_o3Vn4we0jETXuxzA1AsNy-yATM7bkImnC/exec";


/* =====================================================
   VARIABLE
   ===================================================== */

let scanner = null;

let sedangScan = false;

let idMuridSemasa = "";



/* =====================================================
   QR BERJAYA
   ===================================================== */

function qrBerjaya(
  decodedText,
  decodedResult
) {


  console.log(
    "================================"
  );

  console.log(
    "QR BERJAYA DIBACA"
  );

  console.log(
    "Data:",
    decodedText
  );

  console.log(
    "Result:",
    decodedResult
  );

  console.log(
    "================================"
  );


  /*
   * Jangan proses QR kedua
   * selepas QR pertama berjaya.
   */

  if (sedangScan) {

    return;

  }


  sedangScan = true;


  /*
   * Ambil ID
   */

  const idMurid =
    String(decodedText).trim();


  /*
   * Pastikan bukan kosong
   */

  if (!idMurid) {

    sedangScan = false;

    return;

  }


  idMuridSemasa =
    idMurid;


  /*
   * Papar keputusan
   */

  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card success">


      <div class="success-title">

        ✓ QR BERJAYA DIBACA

      </div>


      <div class="big-id">

        ${escapeHTML(idMurid)}

      </div>


      <div class="info">

        ID murid berjaya dibaca.

      </div>


      <div class="notice">

        Tekan <strong>REKOD LEWAT</strong>
        untuk menyimpan rekod murid
        ke dalam sistem.

      </div>


      <button
        onclick="bukaAppsScript()">

        REKOD LEWAT

      </button>


      <button
        class="secondary-button"
        onclick="mulaScanner()">

        SCAN SEMULA

      </button>


    </div>

  `;


  /*
   * Sekarang baru hentikan kamera.
   */

  hentikanScanner();

}



/* =====================================================
   BUKA APPS SCRIPT
   ===================================================== */

function bukaAppsScript() {


  if (!idMuridSemasa) {

    paparRalat(
      "ID murid tidak dijumpai."
    );

    return;

  }


  /*
   * URL yang sama dengan ujian
   * yang sudah terbukti berjaya.
   */

  const url =

    API_URL +

    "?action=rekod" +

    "&id=" +

    encodeURIComponent(
      idMuridSemasa
    );


  console.log(
    "BUKA APPS SCRIPT:",
    url
  );


  /*
   * Buka tab baharu.
   */

  const tab =
    window.open(
      url,
      "_blank"
    );


  /*
   * Jika popup berjaya.
   */

  if (tab) {


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card success">


        <div class="success-title">

          ✓ REKOD DIHANTAR

        </div>


        <div class="big-id">

          ${escapeHTML(
            idMuridSemasa
          )}

        </div>


        <div class="info">

          Sistem rekod telah dibuka
          dalam tab baharu.

        </div>


        <div class="notice">

          Rekod murid telah dihantar
          ke Google Sheet.

          <br><br>

          Kembali ke halaman scanner
          untuk murid seterusnya.

        </div>


        <button
          onclick="mulaScanner()">

          SCAN MURID SETERUSNYA

        </button>


      </div>

    `;


  }

  else {


    /*
     * Popup disekat.
     */

    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">


        <div class="error-title">

          POPUP DISEKAT

        </div>


        <div class="info">

          Browser menyekat pembukaan
          tab baharu.

        </div>


        <button
          onclick="bukaAppsScriptManual()">

          BUKA SISTEM REKOD

        </button>


        <button
          class="secondary-button"
          onclick="mulaScanner()">

          SCAN SEMULA

        </button>


      </div>

    `;

  }

}



/* =====================================================
   BUKA APPS SCRIPT SECARA MANUAL
   ===================================================== */

function bukaAppsScriptManual() {


  if (!idMuridSemasa) {

    return;

  }


  const url =

    API_URL +

    "?action=rekod" +

    "&id=" +

    encodeURIComponent(
      idMuridSemasa
    );


  window.open(
    url,
    "_blank"
  );

}



/* =====================================================
   HENTIKAN SCANNER
   ===================================================== */

function hentikanScanner() {


  if (!scanner) {

    return;

  }


  scanner

    .clear()

    .then(function() {

      console.log(
        "Scanner dihentikan."
      );

    })

    .catch(function(error) {

      console.log(
        "Scanner clear:",
        error
      );

    });

}



/* =====================================================
   MULAKAN SCANNER
   ===================================================== */

function mulaScanner() {


  console.log(
    "Memulakan scanner..."
  );


  /*
   * Reset
   */

  sedangScan = false;

  idMuridSemasa = "";


  document.getElementById(
    "result"
  ).innerHTML = "";


  /*
   * Kalau scanner lama masih ada,
   * cuba bersihkan dahulu.
   */

  if (scanner) {

    scanner

      .clear()

      .catch(function(error) {

        console.log(
          "Scanner lama:",
          error
        );

      });

  }


  /*
   * Bina scanner baharu.
   */

  scanner =
    new Html5Qrcode(
      "reader"
    );


  /* =================================================
     KONFIGURASI SCANNER
     ================================================= */


  /*
   * QR BOX DINAMIK
   *
   * Gunakan 75% daripada kawasan
   * kamera.
   */

  function qrboxFunction(
    viewfinderWidth,
    viewfinderHeight
  ) {


    const minEdge =
      Math.min(
        viewfinderWidth,
        viewfinderHeight
      );


    /*
     * 75% kawasan kamera.
     *
     * Lebih luas daripada 300x300.
     */

    const size =
      Math.floor(
        minEdge * 0.75
      );


    return {

      width:
        size,

      height:
        size

    };

  }


  const config = {

    /*
     * 10-15 fps sudah memadai.
     *
     * Terlalu tinggi boleh membebankan
     * telefon.
     */

    fps: 15,


    /*
     * Kawasan scan dinamik.
     */

    qrbox:
      qrboxFunction,


    /*
     * Jangan paksa 1:1.
     *
     * Kamera telefon biasanya 4:3 atau 16:9.
     */

    aspectRatio: 4 / 3,


    /*
     * Benarkan QR yang terbalik /
     * mirrored.
     */

    disableFlip: false,


    /*
     * Hanya QR.
     */

    formatsToSupport: [

      Html5QrcodeSupportedFormats
        .QR_CODE

    ],


    /*
     * Jika browser menyokong
     * BarcodeDetector, gunakan.
     */

    experimentalFeatures: {

      useBarCodeDetectorIfSupported:
        true

    }

  };


  /*
   * Mulakan kamera.
   */

  scanner.start(

    {
      facingMode:
        "environment"
    },

    config,

    qrBerjaya,

    function(errorMessage) {

      /*
       * Jangan paparkan mesej
       * decoder setiap frame.
       *
       * Ia normal ketika scanner
       * sedang mencari QR.
       */

    }

  )

  .then(function() {

    console.log(
      "================================"
    );

    console.log(
      "KAMERA BERJAYA DIMULAKAN"
    );

    console.log(
      "================================"
    );

  })

  .catch(function(error) {


    console.error(
      "RALAT KAMERA:",
      error
    );


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">


        <div class="error-title">

          KAMERA TIDAK DAPAT DIBUKA

        </div>


        <div class="info">

          ${escapeHTML(
            error.message ||
            String(error)
          )}

        </div>


      </div>

    `;


    sedangScan = false;

  });

}



/* =====================================================
   RALAT
   ===================================================== */

function paparRalat(
  mesej
) {


  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card error">


      <div class="error-title">

        RALAT SISTEM

      </div>


      <div class="info">

        ${escapeHTML(mesej)}

      </div>


    </div>


    <button
      onclick="mulaScanner()">

      SCAN SEMULA

    </button>

  `;


  sedangScan = false;

}



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(
  text
) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}



/* =====================================================
   MULA
   ===================================================== */

mulaScanner();


</script>


</body>

</html>
