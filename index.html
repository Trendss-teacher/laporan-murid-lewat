<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Rekod Murid Lewat</title>


  <!-- QR SCANNER -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f5f9;

      color: #1e293b;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding: 20px;

    }


    .header {

      text-align: center;

      margin-bottom: 20px;

    }


    .header h1 {

      margin: 0;

      font-size: 25px;

    }


    .header p {

      margin-top: 8px;

      color: #64748b;

    }


    #reader {

      background: white;

      padding: 10px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

      overflow: hidden;

    }


    #result {

      margin-top: 20px;

    }


    .card {

      background: white;

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.08);

    }


    .success {

      border-left:
        6px solid #16a34a;

    }


    .error {

      border-left:
        6px solid #dc2626;

    }


    .success-title {

      color: #15803d;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .error-title {

      color: #b91c1c;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .info {

      margin: 9px 0;

      line-height: 1.5;

    }


    .loading {

      text-align: center;

      padding: 20px;

    }


    button {

      width: 100%;

      margin-top: 18px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }

  </style>

</head>



<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>
      REKOD MURID LEWAT
    </h1>

    <p>
      Imbas QR murid yang tiba lewat
    </p>

  </div>


  <!-- SCANNER -->

  <div id="reader"></div>


  <!-- RESULT -->

  <div id="result"></div>


</div>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycby4Pm9xKbwLwVzxZTAWESBILTVSiyXF3i_o3Vn4we0jETXuxzA1AsNy-yATM7bkImnC/exec";


/* =====================================================
   VARIABLE
   ===================================================== */

let scanner = null;

let sedangScan = false;



/* =====================================================
   SEMAK STATUS SELEPAS KEMBALI DARI APPS SCRIPT
   ===================================================== */

function semakStatusKembali() {


  const params =
    new URLSearchParams(
      window.location.search
    );


  const status =
    params.get("status");


  const id =
    params.get("id");


  /*
   * Tiada status.
   *
   * Ini bermaksud kita buka laman
   * secara normal.
   */

  if (!status) {

    return false;

  }


  /*
   * Buang parameter daripada
   * address bar.
   */

  if (
    window.history &&
    window.history.replaceState
  ) {

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  }


  /*
   * REKOD BERJAYA
   */

  if (
    status === "berjaya"
  ) {


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card success">


        <div class="success-title">

          ✓ REKOD BERJAYA

        </div>


        <div class="info">

          <strong>ID Murid:</strong><br>

          ${escapeHTML(id || "")}

        </div>


        <div class="info">

          Murid telah direkod
          sebagai murid lewat.

        </div>


      </div>

    `;


    /*
     * Selepas 1.5 saat,
     * buka scanner semula.
     */

    setTimeout(
      function() {

        mulaScanner();

      },
      1500
    );


    return true;

  }


  /*
   * REKOD GAGAL
   */

  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card error">


      <div class="error-title">

        RALAT REKOD

      </div>


      <div class="info">

        Rekod murid tidak berjaya.

      </div>


    </div>


    <button
      onclick="mulaScanner()">

      CUBA SEMULA

    </button>

  `;


  return true;

}



/* =====================================================
   QR BERJAYA DIBACA
   ===================================================== */

function qrBerjaya(
  decodedText,
  decodedResult
) {


  console.log(
    "QR DIBACA:",
    decodedText
  );


  /*
   * Elakkan scan berganda.
   */

  if (sedangScan) {

    return;

  }


  sedangScan = true;


  /*
   * ID murid.
   */

  const idMurid =
    decodedText.trim();


  /*
   * Paparan sementara.
   */

  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="card">


      <div class="success-title">

        QR BERJAYA DIBACA

      </div>


      <div class="info">

        <strong>ID:</strong><br>

        ${escapeHTML(idMurid)}

      </div>


      <div class="loading">

        Membuka sistem rekod...

      </div>


    </div>

  `;


  /*
   * Hentikan kamera.
   */

  hentikanScanner();


  /*
   * URL GitHub semasa.
   *
   * Kita buang query lama supaya
   * return URL bersih.
   */

  const returnUrl =
    window.location.origin +
    window.location.pathname;


  /*
   * Bina URL Apps Script.
   */

  const url =

    API_URL +

    "?action=rekod" +

    "&id=" +
    encodeURIComponent(
      idMurid
    ) +

    "&returnUrl=" +
    encodeURIComponent(
      returnUrl
    );


  console.log(
    "URL APPS SCRIPT:",
    url
  );


  /*
   * Browser pergi ke Apps Script.
   */

  setTimeout(
    function() {

      window.location.href =
        url;

    },
    500
  );

}



/* =====================================================
   HENTIKAN SCANNER
   ===================================================== */

function hentikanScanner() {


  if (!scanner) {

    return;

  }


  scanner

    .clear()

    .then(function() {

      console.log(
        "Scanner dihentikan."
      );

    })

    .catch(function(error) {

      console.log(
        "Scanner clear:",
        error
      );

    });

}



/* =====================================================
   MULAKAN SCANNER
   ===================================================== */

function mulaScanner() {


  console.log(
    "Memulakan scanner..."
  );


  document.getElementById(
    "result"
  ).innerHTML = "";


  sedangScan = false;


  /*
   * Bersihkan scanner lama.
   */

  if (scanner) {

    scanner

      .clear()

      .catch(function(error) {

        console.log(
          "Scanner lama:",
          error
        );

      });

  }


  /*
   * Scanner baharu.
   */

  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 15,

    qrbox: {

      width: 300,

      height: 300

    },

    aspectRatio: 1.0,

    formatsToSupport: [

      Html5QrcodeSupportedFormats
        .QR_CODE

    ]

  };


  /*
   * Buka kamera.
   */

  scanner.start(

    {
      facingMode:
        "environment"
    },

    config,

    qrBerjaya,

    function(errorMessage) {

      /*
       * Abaikan mesej semasa
       * scanner mencari QR.
       */

    }

  )

  .then(function() {

    console.log(
      "Kamera berjaya dimulakan."
    );

  })

  .catch(function(error) {


    console.error(
      "Ralat kamera:",
      error
    );


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card error">


        <div class="error-title">

          KAMERA TIDAK DAPAT DIBUKA

        </div>


        <div class="info">

          ${escapeHTML(
            error.message ||
            String(error)
          )}

        </div>


      </div>

    `;

  });

}



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(text) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}



/* =====================================================
   MULA SISTEM
   ===================================================== */


/*
 * Kalau baru masuk laman biasa:
 * terus buka scanner.
 *
 * Kalau baru balik daripada Apps Script:
 * papar status dahulu.
 */

const sudahKembali =
  semakStatusKembali();


if (!sudahKembali) {

  mulaScanner();

}


</script>


</body>

</html>
